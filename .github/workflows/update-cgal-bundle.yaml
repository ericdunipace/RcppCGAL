name: Update PR bundle

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Open PR number targeting main or dev (commit only the generated CGAL archive)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: update-cgal-bundle-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Record the PR commit to rebuild
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      repository: ${{ steps.pr.outputs.repository }}
      branch: ${{ steps.pr.outputs.branch }}
    steps:
      - name: Validate the open PR and record its head
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            if (!/^[1-9][0-9]*$/.test(process.env.PR_NUMBER)) {
              throw new Error("Enter a positive integer PR number.");
            }
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== "open" || pr.merged || !pr.head.repo) {
              throw new Error("The PR must be open with an available head repository.");
            }
            if (!["main", "dev", "master"].includes(pr.base.ref)) {
              throw new Error("The PR must target main, dev, or master.");
            }
            const fork = pr.head.repo.full_name !== context.payload.repository.full_name;
            if (fork && !pr.maintainer_can_modify) {
              throw new Error("Enable Allow edits from maintainers on the PR before updating its bundle.");
            }
            core.setOutput("sha", pr.head.sha);
            core.setOutput("repository", pr.head.repo.full_name);
            core.setOutput("branch", pr.head.ref);
            await core.summary.addHeading("Update PR bundle")
              .addRaw("Rebuilding PR #" + pr.number + " at " + pr.head.sha + ". Only inst/include/CGAL_zip.tar.xz will be committed.").write();

  build:
    name: Generate bundle without write credentials
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out maintainer rebuild tooling
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Check out the exact PR commit
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.resolve.outputs.repository }}
          ref: ${{ needs.resolve.outputs.sha }}
          path: candidate
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - name: Download pristine CGAL and apply the PR patch code
        shell: Rscript {0}
        run: |
          source("tooling/tools/ci/rebuild-cgal-bundle.R")
          rebuild_cgal_bundle("candidate")
      - name: Upload the generated archive
        uses: actions/upload-artifact@v4
        with:
          name: pr-cgal-bundle
          path: candidate/inst/include/CGAL_zip.tar.xz
          if-no-files-found: error
          retention-days: 7

  commit:
    name: Commit only the archive if the PR has not changed
    needs: [resolve, build]
    runs-on: ubuntu-latest
    # This fresh runner executes only this trusted workflow's API code.
    # BUNDLE_UPDATE_TOKEN is never supplied to the PR build job.
    steps:
      - name: Require the maintainer write credential
        env:
          UPDATE_TOKEN: ${{ secrets.BUNDLE_UPDATE_TOKEN }}
        run: |
          if [ -z "$UPDATE_TOKEN" ]; then
            echo "::error::Add the BUNDLE_UPDATE_TOKEN Actions secret with a maintainer credential able to push to this PR's head repository. A personal access token also triggers the normal PR checks."
            exit 1
          fi
      - name: Download the archive from this run
        uses: actions/download-artifact@v4
        with:
          name: pr-cgal-bundle
          path: bundle
      - name: Commit the archive through GitHub's Git API
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
          EXPECTED_REPOSITORY: ${{ needs.resolve.outputs.repository }}
          EXPECTED_BRANCH: ${{ needs.resolve.outputs.branch }}
        with:
          github-token: ${{ secrets.BUNDLE_UPDATE_TOKEN }}
          script: |
            const fs = require("fs");
            const archivePath = "inst/include/CGAL_zip.tar.xz";
            const {data: pr} = await github.rest.pulls.get({
              ...context.repo, pull_number: Number(process.env.PR_NUMBER)
            });
            if (pr.state !== "open" || pr.merged ||
                !pr.head.repo ||
                !["main", "dev", "master"].includes(pr.base.ref) ||
                pr.head.sha !== process.env.EXPECTED_SHA ||
                pr.head.repo.full_name !== process.env.EXPECTED_REPOSITORY ||
                pr.head.ref !== process.env.EXPECTED_BRANCH) {
              throw new Error("The PR changed during rebuilding. Run this workflow again; no branch will be updated.");
            }
            if (pr.head.repo.full_name !== context.payload.repository.full_name &&
                !pr.maintainer_can_modify) {
              throw new Error("Allow edits from maintainers is now disabled.");
            }
            const target = {owner: pr.head.repo.owner.login, repo: pr.head.repo.name};
            const archive = fs.readFileSync("bundle/CGAL_zip.tar.xz");
            if (archive.length < 6 ||
                archive.subarray(0, 6).toString("hex") !== "fd377a585a00") {
              throw new Error("The generated artifact is not an xz archive.");
            }
            const {data: parent} = await github.rest.git.getCommit({
              ...target, commit_sha: process.env.EXPECTED_SHA
            });
            const {data: blob} = await github.rest.git.createBlob({
              ...target, content: archive.toString("base64"), encoding: "base64"
            });
            const {data: tree} = await github.rest.git.createTree({
              ...target, base_tree: parent.tree.sha,
              tree: [{path: archivePath, mode: "100644", type: "blob", sha: blob.sha}]
            });
            if (tree.sha === parent.tree.sha) {
              await core.summary.addHeading("Bundle already current")
                .addRaw("The generated archive matches the PR; no commit was needed.").write();
              return;
            }
            const {data: commit} = await github.rest.git.createCommit({
              ...target, message: "Regenerate bundled CGAL headers",
              tree: tree.sha, parents: [process.env.EXPECTED_SHA]
            });
            // Reject concurrent commits instead of overwriting contributor work.
            await github.rest.git.updateRef({
              ...target, ref: "heads/" + pr.head.ref, sha: commit.sha, force: false
            });
            await core.summary.addHeading("Bundle committed")
              .addRaw("Updated only " + archivePath + " in PR #" + pr.number +
                ". New commit: " + commit.sha +
                ". The maintainer token's push triggers normal PR checks; verify they finish before merging.").write();
