name: "CGAL shipped bundle: current and unchanged by install"

# The rebuilt-bundle checks prove the candidate headers work. These jobs cover
# the committed inst/include/CGAL_zip.tar.xz, which is what ships:
# - stale-bundle: on PRs into main/master and on dispatch (including the bot's
#   follow-up run after it commits a regenerated bundle), the committed bundle
#   must match the candidate rebuilt in this run, so the rebuilt-bundle results
#   apply to it.
# - install-preservation: installing must not change the bundled headers.
# On dev PRs and pushes the committed bundle is expected to lag patch changes
# until the bot regenerates it, so it is not compared or compiled there.

on:
  workflow_call:

jobs:
  stale-bundle:
    name: Committed bundle matches rebuild
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      (github.base_ref == 'main' || github.base_ref == 'master'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download the candidate bundle rebuilt in this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cgal-candidate-bundle
          path: ${{ runner.temp }}/candidate

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release

      - name: Compare committed and rebuilt header contents
        id: compare
        run: Rscript tools/ci/bundle-changed.R inst/include/CGAL_zip.tar.xz "$RUNNER_TEMP/candidate/CGAL_zip.tar.xz"

      - name: Fail if the committed bundle is stale
        if: steps.compare.outputs.changed == 'true'
        run: |
          echo "::error::inst/include/CGAL_zip.tar.xz does not match the bundle rebuilt from this branch's patch code. Merge the patch changes into dev, let the bot commit the regenerated bundle, then update this PR."
          exit 1

      # bash, not Rscript: must report even when setup-r failed.
      - name: Explain committed bundle comparison
        if: ${{ always() }}
        env:
          COMPARE_RESULT: ${{ steps.compare.outcome }}
          CHANGED: ${{ steps.compare.outputs.changed }}
        shell: bash
        run: |
          compare="${COMPARE_RESULT:-not run}"
          {
            echo "## Committed bundle matches rebuild"
            echo
            echo "Compares the CGAL files in the committed inst/include/CGAL_zip.tar.xz with the candidate rebuilt from pristine CGAL in this run, ignoring archive metadata."
            echo
            echo "- Comparison: ${compare}"
            if [[ "$CHANGED" == true ]]; then
              echo "- Result: stale; the committed bundle differs from the rebuild"
              echo
              echo "The rebuilt-bundle checks do not cover what ships until the bot regenerates the committed bundle. Merge the patch changes into dev and wait for the bot's \"Regenerate bundled CGAL headers\" commit before releasing."
            elif [[ "$CHANGED" == false ]]; then
              echo "- Result: current; the rebuilt-bundle checks apply to the committed bundle"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  install-preservation:
    name: Install preserves the committed bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          dependencies: '"hard"'

      - name: Record the headers shipped in the bundle
        shell: Rscript {0}
        run: |
          # Inspect the archive directly, without configure or patch helpers.
          archive <- "inst/include/CGAL_zip.tar.xz"
          stopifnot(file.exists(archive))
          extracted <- tempfile("cgal-shipped-")
          dir.create(extracted)
          utils::untar(archive, exdir = extracted)
          roots <- list.dirs(extracted, recursive = FALSE, full.names = TRUE)
          stopifnot(length(roots) == 1L)
          root <- roots[[1L]]
          stopifnot(file.exists(file.path(root, "basic.h")))
          files <- sort(list.files(root, recursive = TRUE, all.files = TRUE))
          manifest <- setNames(
            unname(tools::md5sum(file.path(root, files))), files
          )
          stopifnot(length(manifest) > 0L, !anyNA(manifest))
          saveRDS(manifest, file.path(
            Sys.getenv("RUNNER_TEMP"), "rcppcgal-bundle-manifest.rds"
          ))
          unlink(extracted, recursive = TRUE)

      - name: Install RcppCGAL from the committed bundle
        id: install
        env:
          CGAL_DIR: ""
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")

      - name: Verify installation preserves the bundled headers
        id: preservation
        shell: Rscript {0}
        run: |
          expected <- readRDS(file.path(
            Sys.getenv("RUNNER_TEMP"), "rcppcgal-bundle-manifest.rds"
          ))
          root <- system.file("include", "CGAL", package = "RcppCGAL")
          stopifnot(nzchar(root), dir.exists(root))
          files <- sort(list.files(root, recursive = TRUE, all.files = TRUE))
          installed <- setNames(
            unname(tools::md5sum(file.path(root, files))), files
          )
          stopifnot(!anyNA(installed))
          missing <- setdiff(names(expected), names(installed))
          added <- setdiff(names(installed), names(expected))
          common <- intersect(names(expected), names(installed))
          changed <- common[expected[common] != installed[common]]
          differences <- c(
            sprintf("missing: %s", missing),
            sprintf("added: %s", added),
            sprintf("changed: %s", changed)
          )
          if (length(missing) + length(added) + length(changed) > 0L) {
            stop(paste(c(
              "Installation changed the bundled CGAL headers.",
              "Remove bundled-header edits from the installation path.",
              "Apply fixes during bundle generation. After merge, successful rebuilt-bundle checks commit the regenerated archive automatically.",
              "Downloaded or user-supplied CGAL may still be patched; this check covers only the committed bundle.",
              head(differences, 20L)
            ), collapse = "\n"), call. = FALSE)
          }
          message("Installed CGAL headers match the shipped bundle.")

      # bash, not Rscript: must report even when setup-r failed.
      - name: Explain install preservation result
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          PRESERVATION_RESULT: ${{ steps.preservation.outcome }}
        shell: bash
        run: |
          install="${INSTALL_RESULT:-not run}"
          preservation="${PRESERVATION_RESULT:-not run}"
          {
            echo "## Install preserves the committed bundle"
            echo
            echo "Installs RcppCGAL from the committed inst/include/CGAL_zip.tar.xz and verifies the installed CGAL files match it."
            echo
            echo "- Installation: ${install}"
            echo "- Bundled headers unchanged: ${preservation}"
            if [[ "$preservation" == failure ]]; then
              echo
              echo "Installation modified the bundled headers. Inspect the diagnostics for changed, missing, or added headers, remove those edits from the installation path, and apply fixes during bundle generation instead. Downloaded or user-supplied CGAL may still be patched."
            fi
            if [[ "$install" == failure ]]; then
              echo
              echo "Installation failed. Inspect the installation diagnostics."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
