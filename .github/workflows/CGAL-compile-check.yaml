name: "CGAL shipped bundle: unchanged install + downstream checks"

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  cgal-audit:
    name: Shipped bundle checks (${{ matrix.config.os }}, ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'release' }
          - { os: ubuntu-latest,   r: 'devel', http-user-agent: 'release' }
          - { os: macos-latest, r: 'release' }
          - { os: windows-latest, r: 'release' }

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::Rcpp
            any::rcmdcheck

      - name: Test header patch transformations
        shell: Rscript {0}
        run: |
          testthat::test_file("tools/tests/test-semantic-patches.R")

      - name: Record the headers shipped in the bundle
        shell: Rscript {0}
        run: |
          # Inspect the archive directly, without configure or patch helpers.
          archive <- "inst/include/CGAL_zip.tar.xz"
          stopifnot(file.exists(archive))
          extracted <- tempfile("cgal-shipped-")
          dir.create(extracted)
          utils::untar(archive, exdir = extracted)
          roots <- list.dirs(extracted, recursive = FALSE, full.names = TRUE)
          stopifnot(length(roots) == 1L)
          root <- roots[[1L]]
          stopifnot(file.exists(file.path(root, "basic.h")))
          files <- sort(list.files(root, recursive = TRUE, all.files = TRUE))
          manifest <- setNames(
            unname(tools::md5sum(file.path(root, files))), files
          )
          stopifnot(length(manifest) > 0L, !anyNA(manifest))
          saveRDS(manifest, file.path(
            Sys.getenv("RUNNER_TEMP"), "rcppcgal-bundle-manifest.rds"
          ))
          unlink(extracted, recursive = TRUE)

      - name: Install RcppCGAL from the committed bundle
        id: install
        env:
          CGAL_DIR: ""
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          install.packages("BH")
          install.packages("RcppEigen")

      - name: Verify installation preserves the bundled headers
        id: preservation
        shell: Rscript {0}
        run: |
          expected <- readRDS(file.path(
            Sys.getenv("RUNNER_TEMP"), "rcppcgal-bundle-manifest.rds"
          ))
          root <- system.file("include", "CGAL", package = "RcppCGAL")
          stopifnot(nzchar(root), dir.exists(root))
          files <- sort(list.files(root, recursive = TRUE, all.files = TRUE))
          installed <- setNames(
            unname(tools::md5sum(file.path(root, files))), files
          )
          stopifnot(!anyNA(installed))
          missing <- setdiff(names(expected), names(installed))
          added <- setdiff(names(installed), names(expected))
          common <- intersect(names(expected), names(installed))
          changed <- common[expected[common] != installed[common]]
          differences <- c(
            sprintf("missing: %s", missing),
            sprintf("added: %s", added),
            sprintf("changed: %s", changed)
          )
          if (length(missing) + length(added) + length(changed) > 0L) {
            stop(paste(c(
              "Installation changed the bundled CGAL headers.",
              "Remove bundled-header edits from the installation path.",
              "Apply fixes during bundle generation and commit the regenerated inst/include/CGAL_zip.tar.xz.",
              "Downloaded or user-supplied CGAL may still be patched; this check covers only the committed bundle.",
              head(differences, 20L)
            ), collapse = "\n"), call. = FALSE)
          }
          message("Installed CGAL headers match the shipped bundle.")

      - name: Compile header smoke tests
        id: smoke
        shell: Rscript {0}
        run: |
          source("tools/compile-cgal-headers.R")
          compile_cgal_headers()

      - name: Check downstream dummy package; compiler warnings fail
        id: dummy
        shell: Rscript {0}
        run: |
          pkg <- pkgbuild::build(
            "tools/cran-probe",
            dest_path = tempdir()
          )

          result <- rcmdcheck::rcmdcheck(
            pkg,
            args = "--no-manual",
            error_on = "warning"
          )

      - name: Explain shipped bundle check results
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          PRESERVATION_RESULT: ${{ steps.preservation.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          DUMMY_RESULT: ${{ steps.dummy.outcome }}
        shell: Rscript {0}
        run: |
          results <- c(
            Installation = Sys.getenv("INSTALL_RESULT"),
            `Bundled headers unchanged` = Sys.getenv("PRESERVATION_RESULT"),
            `Header smoke compilation` = Sys.getenv("SMOKE_RESULT"),
            `Downstream dummy package` = Sys.getenv("DUMMY_RESULT")
          )
          results[results == ""] <- "not run"
          lines <- c(
            "## Shipped bundle checks",
            "Installs the committed inst/include/CGAL_zip.tar.xz, verifies the installed CGAL files match it, then checks downstream use.",
            paste(sprintf("- %s: %s", names(results), results), collapse = "\n")
          )
          if (Sys.getenv("PRESERVATION_RESULT") == "failure") lines <- c(lines,
            "The preservation check failed. Inspect its diagnostics for changed, missing, or added headers. If installation modified them, remove those bundled-header edits from the installation path, apply fixes before bundling, and commit the regenerated archive. Downloaded or user-supplied CGAL may still be patched.",
            "If the rebuilt-bundle workflow passes while this check fails, the candidate passed its tests but the committed bundle or its installation behavior still needs revision.")
          if (Sys.getenv("INSTALL_RESULT") == "failure") lines <- c(lines,
            "Installation failed. Inspect the installation diagnostics; downstream checks could not run.")
          if (any(results[c(3L, 4L)] == "failure")) lines <- c(lines,
            "The committed headers produced downstream compilation/check problems. Inspect the compiler and R CMD check diagnostics. Compiler warnings fail the dummy check; update the patch code and regenerate the committed bundle.")
          cat(paste(lines, collapse = "\n\n"), "\n",
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
