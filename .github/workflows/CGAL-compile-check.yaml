name: CGAL header audit

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  cgal-audit:
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'release' }
          - { os: ubuntu-latest,   r: 'devel', http-user-agent: 'release' }
          - { os: macos-latest, r: 'release' }
          - { os: windows-latest, r: 'release' }

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::Rcpp
            any::rcmdcheck

      - name: Test CGAL maintainer tooling
        shell: Rscript {0}
        run: |
          testthat::test_file("tools/tests/test-semantic-patches.R")

      - name: Install RcppCGAL
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          install.packages("BH")
          install.packages("RcppEigen")

      - name: Verify installed headers contain reviewed semantic patches
        shell: Rscript {0}
        run: |
          source("tools/config/semantic_patches.R")
          include <- system.file("include", "CGAL", package = "RcppCGAL")
          if (!nzchar(include)) stop("Installed CGAL headers not found")
          checks <- list(
            .cgal_patch_repair_polygon_soup = list(
              path = "Polygon_mesh_processing/repair_polygon_soup.h",
              marker = "CGAL::internal::resize(canonical_polygon, polygon.size());"
            ),
            .cgal_patch_garland_heckbert = list(
              path = "Surface_mesh_simplification/Policies/Edge_collapse/internal/GarlandHeckbert_policy_base.h",
              marker = "m_cost_matrices = get(Cost_property(), tmesh, Cost_matrix::Zero());"
            )
          )
          for (patch in names(checks)) {
            if (!exists(patch, mode = "function", inherits = FALSE)) next
            header <- file.path(include, checks[[patch]]$path)
            if (!file.exists(header) ||
                !any(grepl(checks[[patch]]$marker,
                           readLines(header, warn = FALSE), fixed = TRUE))) {
              stop("Installed header does not contain ", patch, ": ", header)
            }
          }

      - name: Compile header smoke tests
        shell: Rscript {0}
        run: |
          source("tools/compile-cgal-headers.R")
          compile_cgal_headers()

      - name: Check compiled CGAL probe
        shell: Rscript {0}
        run: |
          pkg <- pkgbuild::build(
            "tools/cran-probe",
            dest_path = tempdir()
          )

          result <- rcmdcheck::rcmdcheck(
            pkg,
            args = "--no-manual",
            error_on = "warning"
          )
