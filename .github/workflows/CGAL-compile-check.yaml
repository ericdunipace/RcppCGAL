name: "CGAL shipped bundle: unchanged install + downstream checks"

on:
  workflow_call:

jobs:
  cgal-audit:
    name: Shipped bundle checks (${{ matrix.config.os }}, ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: 'release' }
          - { os: ubuntu-latest,   r: 'devel', http-user-agent: 'release' }
          - { os: macos-latest, r: 'release' }
          - { os: windows-latest, r: 'release' }

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Use the main Ubuntu archive instead of the Azure mirror
        if: runner.os == 'Linux'
        run: |
          # setup-r apt-installs system packages, and azure.archive.ubuntu.com
          # has stalled that step past the job timeout.
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
          fi
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          extra-packages: |
            any::Rcpp
            any::rcmdcheck

      - name: Test header patch transformations
        shell: Rscript {0}
        run: |
          testthat::test_file("tools/tests/test-semantic-patches.R")

      - name: Record the headers shipped in the bundle
        shell: Rscript {0}
        run: |
          # Inspect the archive directly, without configure or patch helpers.
          archive <- "inst/include/CGAL_zip.tar.xz"
          stopifnot(file.exists(archive))
          extracted <- tempfile("cgal-shipped-")
          dir.create(extracted)
          utils::untar(archive, exdir = extracted)
          roots <- list.dirs(extracted, recursive = FALSE, full.names = TRUE)
          stopifnot(length(roots) == 1L)
          root <- roots[[1L]]
          stopifnot(file.exists(file.path(root, "basic.h")))
          files <- sort(list.files(root, recursive = TRUE, all.files = TRUE))
          manifest <- setNames(
            unname(tools::md5sum(file.path(root, files))), files
          )
          stopifnot(length(manifest) > 0L, !anyNA(manifest))
          saveRDS(manifest, file.path(
            Sys.getenv("RUNNER_TEMP"), "rcppcgal-bundle-manifest.rds"
          ))
          unlink(extracted, recursive = TRUE)

      - name: Install RcppCGAL from the committed bundle
        id: install
        env:
          CGAL_DIR: ""
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          install.packages("BH")
          install.packages("RcppEigen")

      - name: Verify installation preserves the bundled headers
        id: preservation
        shell: Rscript {0}
        run: |
          expected <- readRDS(file.path(
            Sys.getenv("RUNNER_TEMP"), "rcppcgal-bundle-manifest.rds"
          ))
          root <- system.file("include", "CGAL", package = "RcppCGAL")
          stopifnot(nzchar(root), dir.exists(root))
          files <- sort(list.files(root, recursive = TRUE, all.files = TRUE))
          installed <- setNames(
            unname(tools::md5sum(file.path(root, files))), files
          )
          stopifnot(!anyNA(installed))
          missing <- setdiff(names(expected), names(installed))
          added <- setdiff(names(installed), names(expected))
          common <- intersect(names(expected), names(installed))
          changed <- common[expected[common] != installed[common]]
          differences <- c(
            sprintf("missing: %s", missing),
            sprintf("added: %s", added),
            sprintf("changed: %s", changed)
          )
          if (length(missing) + length(added) + length(changed) > 0L) {
            stop(paste(c(
              "Installation changed the bundled CGAL headers.",
              "Remove bundled-header edits from the installation path.",
              "Apply fixes during bundle generation. After merge, successful rebuilt-bundle checks commit the regenerated archive automatically.",
              "Downloaded or user-supplied CGAL may still be patched; this check covers only the committed bundle.",
              head(differences, 20L)
            ), collapse = "\n"), call. = FALSE)
          }
          message("Installed CGAL headers match the shipped bundle.")

      - name: Compile header smoke tests
        id: smoke
        shell: Rscript {0}
        run: |
          source("tools/compile-cgal-headers.R")
          compile_cgal_headers()

      - name: Check downstream dummy package; compiler warnings fail
        id: dummy
        shell: Rscript {0}
        run: |
          pkg <- pkgbuild::build(
            "tools/cran-probe",
            dest_path = tempdir()
          )

          result <- rcmdcheck::rcmdcheck(
            pkg,
            args = "--no-manual",
            error_on = "warning"
          )

      - name: Explain shipped bundle check results
        if: ${{ always() }}
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          PRESERVATION_RESULT: ${{ steps.preservation.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          DUMMY_RESULT: ${{ steps.dummy.outcome }}
        # bash (3.2-compatible for macOS), not Rscript: must report even when setup-r failed.
        shell: bash
        run: |
          install="${INSTALL_RESULT:-not run}"
          preservation="${PRESERVATION_RESULT:-not run}"
          smoke="${SMOKE_RESULT:-not run}"
          dummy="${DUMMY_RESULT:-not run}"
          {
            echo "## Shipped bundle checks"
            echo
            echo "Installs the committed inst/include/CGAL_zip.tar.xz, verifies the installed CGAL files match it, then checks downstream use."
            echo
            echo "- Installation: ${install}"
            echo "- Bundled headers unchanged: ${preservation}"
            echo "- Header smoke compilation: ${smoke}"
            echo "- Downstream dummy package: ${dummy}"
            if [[ "$preservation" == failure ]]; then
              echo
              echo "The preservation check failed. Inspect its diagnostics for changed, missing, or added headers. If installation modified them, remove those bundled-header edits from the installation path and apply fixes before bundling. After merge, successful rebuilt-bundle checks commit the regenerated archive automatically. Downloaded or user-supplied CGAL may still be patched."
              echo
              echo "If the rebuilt-bundle workflow passes while this check fails, the candidate passed its tests but the committed bundle or its installation behavior still needs revision."
            fi
            if [[ "$install" == failure ]]; then
              echo
              echo "Installation failed. Inspect the installation diagnostics; downstream checks could not run."
            fi
            if [[ "$smoke" == failure || "$dummy" == failure ]]; then
              echo
              echo "The committed headers produced downstream compilation/check problems. Inspect the compiler and R CMD check diagnostics. Compiler warnings fail the dummy check; update the patch code. After merge, successful rebuilt-bundle checks regenerate and commit the archive automatically."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
